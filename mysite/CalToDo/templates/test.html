{% extends "base/base.html" %}
{% load static %}

{% block extra_css %}
    <!-- Additional stylesheet specific to this page -->
    <link rel="stylesheet" href="{% static 'css/finance_dashboard.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.4/main.min.css" rel="stylesheet" />
{% endblock %}

{% block template %}

<body>
    <div class="header">
        <div class="title"><b></b>Testing<b></b></div>
    </div>
    <div class="Grid_toprow">
        <div id="calendar"></div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.4/main.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        if (!calendarEl) {
            console.error("Calendar element not found!");
        } else {
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                events: '/get-calendar-data/',
                eventDidMount: function(info) {
                    console.log(info.event.extendedProps); // Debug event data
                },
                eventContent: function(info) {
                    return {
                        html: `<b>${info.event.title}</b><br>${info.event.extendedProps.description || ''}`
                    };
                }
            });
            calendar.render();
        }
    });
</script>

{% endblock %}
